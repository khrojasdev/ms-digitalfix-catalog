spring:
  application:
    name: ms-digitalfix-catalog
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
    username: ${SPRING_DATASOURCE_USERNAME:DFX_CATALOG}
    password: ${SPRING_DATASOURCE_PASSWORD:digitalfix}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: catalog-pool
  jpa:
    hibernate:
      ddl-auto: validate      # el esquema lo gobierna Flyway, nunca Hibernate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

# Nomenclatura centralizada de la mensajeria: ningun nombre de exchange o
# routing key se escribe a mano en el codigo.
amqp:
  exchange:
    stock: catalogo.stock.exchange
  routing-key:
    stock-bajo-minimo: stock.bajo-minimo

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId:-sin-correlacion}] %logger{36} - %msg%n"
